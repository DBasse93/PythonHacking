<!doctype html>
<html lang="de">
<head>
  <title>{% block title %}{% endblock %} - MyApp</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
</head>

<body style="background-color: #e9ecef;" >

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">

    <!-- Logo / Titel -->
    <a class="navbar-brand" href="#">MyApp</a>

    <!-- Mobile Toggle -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Menü -->
    <div class="collapse navbar-collapse" id="navbarNav">

      <!-- Links -->
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('dashboard.home') }}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('dashboard.weather') }}">Wetterdaten</a>
        </li>
      </ul>

      <!-- Rechts -->
      <ul class="navbar-nav">
        {% if g.user %}
          <li class="nav-item">
            <span class="navbar-text text-white me-3">{{ g.user['username'] }}</span>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('auth.logout') }}">Logout</a>
          </li>
        {% else %}

        {% endif %}
      </ul>

    </div>
  </div>
</nav>

<section class="content container mt-4">
  <header>
    {% block header %}{% endblock %}
  </header>

  {% for message in get_flashed_messages() %}
    <div class="alert alert-info">{{ message }}</div>
  {% endfor %}

  {% block content %}{% endblock %}
</section>

</body>
</html>
