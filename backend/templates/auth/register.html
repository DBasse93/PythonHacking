{% block content %}

  <form method="post" class="row g-3">
  <div class="col-md-4">
    <label for="username" class="form-label">Username</label>
    <input type="text" class="form-control is-valid" name="username" id="username" value="Mark" required>
    <div class="valid-feedback">
      Looks good!
    </div>
  </div>
  <div class="col-md-4">
    <label for="password" class="form-label">Password</label>
    <input type="password" class="form-control is-valid" name="password" id="password" value="Otto" required>
    <div class="valid-feedback">
      Looks good!
    </div>
  </div>
  <div class="col-md-4">
    <label for="email" class="form-label">Email</label>
    <input type="text" class="form-control is-valid" name="email" id="email" value="Otto" required>
    <div class="valid-feedback">
      Looks good!
    </div>
  </div>
  <div class="col-12">
    <button class="btn btn-primary" type="submit" value="Register">Submit form</button>
  </div>
</form>
{% endblock %}
