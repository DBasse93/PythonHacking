[tool.black]
line-length = 120
target-version = ["py310"]
skip-string-normalization = true
exclude = [".venv", "__pycache__"]

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
skip = [".venv", "__pycache__"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict = true
exclude = [".venv", "__pycache__"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "--tb=short -q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".venv",
    "__pycache__",
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".pytest_cache",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E203"]
fixable = ["ALL"]